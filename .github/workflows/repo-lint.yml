---
name: Repo Lint

on:
  pull_request:
    branches: [main]

jobs:
  repo-lint:
    uses: inductive-automation/common-workflows/.github/workflows/repo-lint.yml@v0.4
    with:
      shellcheck: true
      markdownlint: true
      yamllint: true
      ignition-scripts-lint: false
      ignition-views-lint: true
      ignition-views-lint-include: 'changed'
