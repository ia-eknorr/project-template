---
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: Shell Lint
        entry: shellcheck
        language: system
        types: [shell]
        files: \.sh$

  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint
        name: Markdown Lint
        entry: markdownlint
        language: system
        args:
          - "--config=.markdownlint.json"
          - "--ignore-path=.markdownlintignore"
        types: [markdown]

  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: v1.9.1
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        args:
          - "--rcfile=.pylintrc"
          - "--msg-template='{path}:\n  Line {line}: {msg_id}: {msg}'"
        files: .*code\.py$
        types: [python]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: YAML Lint
        entry: yamllint
        language: system
        args:
          - "--config-file=.yamllint.yml"
        types: [yaml]
